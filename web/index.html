<!DOCTYPE html>
<html lang="ko">
<head>
  <!--

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="내 반에서 너는 어디에 앉을까? 친구들과 우리만의 교실을 채워보세요.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="내 반에 앉아봐">
  <meta property="og:title" content="내 반에 앉아봐">
  <meta property="og:description" content="내 반에서 너는 어디에 앉을까?">
  <meta property="og:url" content="https://h0ng95.github.io/seat-mate/">
  <meta property="og:image" content="https://h0ng95.github.io/seat-mate/assets/assets/images/og-classroom.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="내 반에 앉아봐">
  <meta name="twitter:description" content="내 반에서 너는 어디에 앉을까?">
  <meta name="twitter:image" content="https://h0ng95.github.io/seat-mate/assets/assets/images/og-classroom.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>내 반에 앉아봐</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #f7f3ea; }
    #boot-loading {
      position: fixed; inset: 0; display: grid; place-content: center;
      gap: 14px; color: #332f2c; font: 600 15px/1.5 sans-serif;
      text-align: center;
    }
    #boot-chalk { width: 34px; height: 7px; margin: auto; background: #fefcf6; border: 1px solid #d8cfc1; }
  </style>
</head>
<body>
  <div id="boot-loading" role="status">
    <div id="boot-chalk"></div>
    <span>칠판 닦는 중...</span>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('boot-loading')?.remove();
    });
  </script>
</body>
</html>
